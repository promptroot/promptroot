<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>SDD History - PromptRoot</title>
  <link rel="icon" type="image/x-icon" href="../../assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="../../src/styles.css" />
  <script src="../../src/font-init.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.0/marked.min.js"></script>
  <script type="module" src="../../src/firebase-init.js"></script>
  <script type="module" src="../../src/sw-register.js"></script>
</head>
<body data-page="wiki-history">

  <div class="wrap wiki-history-wrap">
    <main class="card pad-lg wiki-history-card">
      <div class="wiki-history-header">
        <h2 class="section-title-lg font-22 mb-0">
          <span class="icon icon-inline" aria-hidden="true">history</span>
          <span id="wikiHistoryTitle">SDD History</span>
        </h2>
        <a id="wikiHistoryBackLink" class="btn sm" href="/pages/wiki/wiki.html">
          <span class="icon icon-inline" aria-hidden="true">arrow_back</span> Back to Wiki
        </a>
      </div>

      <div id="wikiHistoryError" class="wiki-edit-error" role="alert" aria-live="polite" hidden></div>

      <div class="wiki-history-layout">
        <aside class="wiki-history-list-pane">
          <h3 class="wiki-edit-section-title">Versions</h3>
          <ul id="wikiHistoryList" class="wiki-history-list"></ul>
          <p id="wikiHistoryEmpty" class="tenants-empty" hidden>No version history.</p>
        </aside>
        <section class="wiki-history-detail-pane">
          <div class="wiki-history-detail-header" hidden id="wikiHistoryDetailHeader">
            <div>
              <strong id="wikiHistoryDetailLabel"></strong>
              <span id="wikiHistoryDetailMeta" class="wiki-history-detail-meta"></span>
            </div>
            <div class="wiki-history-detail-actions">
              <button id="wikiHistoryRestoreBtn" class="btn sm primary" type="button">Restore this version</button>
            </div>
          </div>
          <article id="wikiHistoryDetailBody" class="markdown-body wiki-history-detail-body">
            <p class="wiki-placeholder">Pick a version on the left to view it.</p>
          </article>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="../../src/shared-init.js"></script>
  <script type="module" src="../../src/pages/wiki-history-page.js"></script>
</body>
</html>
