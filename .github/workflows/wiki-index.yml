name: Build wiki index

on:
  push:
    branches: [main]
    paths:
      - 'docs/sdd/**'
      - 'scripts/build-wiki-index.js'
      - 'scripts/lib/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build wiki index and chunks
        run: node scripts/build-wiki-index.js

      - name: Commit regenerated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sdd/_index.json docs/sdd/_chunks.json
          if git diff --staged --quiet; then
            echo "No index changes to commit"
          else
            git commit -m "chore(wiki): regenerate _index.json and _chunks.json"
            git push
          fi
